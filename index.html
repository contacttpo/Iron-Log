<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iron Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1C1E22;
      --surface: #26292E;
      --surface-2: #2F3339;
      --text: #F5F3EE;
      --text-dim: #9AA0A6;
      --accent: #E5484D; /* default, overridden per day-type */
      --accent-dim: rgba(229,72,77,0.18);
      --radius: 14px;
    }
    body.day-chest   { --accent: #E5484D; --accent-dim: rgba(229,72,77,0.18); }
    body.day-back    { --accent: #3B6FD4; --accent-dim: rgba(59,111,212,0.18); }
    body.day-shoulders { --accent: #E3B23D; --accent-dim: rgba(227,178,61,0.18); }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
    .mono { font-family: 'Roboto Mono', monospace; }
    .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.03em; }

    #app { max-width: 480px; margin: 0 auto; padding-bottom: 84px; min-height: 100vh; }

    header { padding: 22px 18px 16px; }
    header .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-dim); font-weight: 600; }
    header h1 { font-size: 40px; margin: 2px 0 10px; line-height: 0.95; }
    .day-pill { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent); padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; }
    .day-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

    .picker-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); font-weight: 600; margin: 14px 0 8px; }
    .day-picker { display: flex; gap: 8px; }
    .day-opt { flex: 1; padding: 10px 6px; border-radius: 10px; border: 1.5px solid var(--surface-2); background: var(--surface); color: var(--text-dim); font-size: 12px; font-weight: 700; text-align: center; cursor: pointer; line-height: 1.3; }
    .day-opt.suggested::after { content: '★ suggested'; display: block; font-size: 9px; font-weight: 600; margin-top: 3px; letter-spacing: 0.02em; opacity: 0.8; }
    .day-opt.chest.active { border-color: #E5484D; color: #E5484D; background: rgba(229,72,77,0.14); }
    .day-opt.back.active { border-color: #3B6FD4; color: #3B6FD4; background: rgba(59,111,212,0.14); }
    .day-opt.shoulders.active { border-color: #E3B23D; color: #E3B23D; background: rgba(227,178,61,0.14); }

    .streak-row { display: flex; gap: 10px; padding: 0 18px 8px; }
    .stat-chip { flex: 1; background: var(--surface); border-radius: var(--radius); padding: 12px 14px; }
    .stat-chip .num { font-family: 'Roboto Mono', monospace; font-size: 22px; font-weight: 700; color: var(--accent); }
    .stat-chip .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

    main { padding: 6px 18px 18px; }
    .muscle-heading { font-size: 13px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); margin: 20px 0 8px; font-weight: 700; }

    .card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; border: 1px solid transparent; transition: border-color .15s; }
    .card.open { border-color: var(--accent); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; cursor: pointer; }
    .ex-name { font-weight: 600; font-size: 15.5px; line-height: 1.3; }
    .ex-meta { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
    .ex-meta .last { color: var(--text); font-family: 'Roboto Mono', monospace; }
    .chevron { color: var(--text-dim); font-size: 18px; margin-left: 10px; transition: transform .2s; }
    .card.open .chevron { transform: rotate(180deg); color: var(--accent); }

    .plate-track { display: flex; gap: 5px; margin-top: 10px; }
    .plate { flex: 1; height: 6px; border-radius: 4px; background: var(--surface-2); }
    .plate.filled { background: var(--accent); }

    .set-editor { display: none; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--surface-2); }
    .card.open .set-editor { display: block; }
    .set-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .set-label { width: 44px; font-size: 12px; color: var(--text-dim); font-weight: 600; }
    .stepper { display: flex; align-items: center; background: var(--surface-2); border-radius: 10px; flex: 1; }
    .stepper button { background: none; border: none; color: var(--accent); font-size: 18px; font-weight: 700; width: 38px; height: 38px; cursor: pointer; }
    .stepper .val { flex: 1; text-align: center; font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 15px; }
    .stepper .unit { font-size: 10px; color: var(--text-dim); position: absolute; }

    .log-btn { width: 100%; padding: 12px; margin-top: 6px; background: var(--accent); color: #14151a; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
    .tip { margin-top: 10px; font-size: 12.5px; color: var(--accent); background: var(--accent-dim); padding: 8px 10px; border-radius: 8px; display: none; }

    /* Progress tab */
    .vol-row { margin-bottom: 16px; }
    .vol-label-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
    .vol-label-row .m { font-weight: 600; }
    .vol-label-row .v { color: var(--text-dim); font-family: 'Roboto Mono', monospace; }
    .vol-bar-bg { height: 10px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
    .vol-bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent), #E5484D, #3B6FD4, #E3B23D); }

    /* Library tab */
    .lib-group { margin-bottom: 18px; }
    .lib-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--surface-2); font-size: 14px; gap: 10px; }
    .lib-item.disabled .ex-title { color: var(--text-dim); text-decoration: line-through; }
    .lib-item .info { flex: 1; }
    .lib-item .r { color: var(--text-dim); font-family: 'Roboto Mono', monospace; font-size: 12px; display: block; margin-top: 2px; }
    .switch { width: 40px; height: 24px; border-radius: 999px; background: var(--surface-2); position: relative; cursor: pointer; flex-shrink: 0; transition: background .15s; }
    .switch.on { background: #3FA35C; }
    .switch .knob { width: 18px; height: 18px; border-radius: 50%; background: #F5F3EE; position: absolute; top: 3px; left: 3px; transition: left .15s; }
    .switch.on .knob { left: 19px; }

    .empty { text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 14px; }

    /* Log / Skip buttons */
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .log-btn { flex: 2; margin-top: 0; }
    .skip-btn { flex: 1; margin-top: 0; padding: 12px; background: var(--surface-2); color: var(--text-dim); border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
    .card.skipped { opacity: 0.45; }
    .skip-tag { font-size: 10px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; margin-left: 6px; letter-spacing: 0.04em; }

    /* Rest timer overlay */
    #restTimer { position: fixed; left: 0; right: 0; bottom: 84px; max-width: 480px; margin: 0 auto; background: var(--accent); color: #14151a; padding: 14px 18px; display: none; align-items: center; justify-content: space-between; font-weight: 700; z-index: 50; }
    #restTimer.show { display: flex; }
    #restTimer .rt-time { font-family: 'Roboto Mono', monospace; font-size: 22px; }
    #restTimer .rt-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.85; }
    #restTimer button { background: rgba(20,21,26,0.18); border: none; color: #14151a; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; }

    nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--surface-2); display: flex; max-width: 480px; margin: 0 auto; }
    nav button { flex: 1; background: none; border: none; padding: 12px 0 10px; color: var(--text-dim); font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; }
    nav button .icon { display: block; font-size: 19px; margin-bottom: 3px; }
    nav button.active { color: var(--accent); }

    .view { display: none; }
    .view.active { display: block; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="eyebrow">Today's session</div>
      <h1 class="display" id="dayTitle">Loading…</h1>
      <span class="day-pill" id="dayPill"><span class="dot"></span><span id="dayPillText">—</span></span>

      <div class="picker-label">Train something else today?</div>
      <div class="day-picker" id="dayPicker">
        <div class="day-opt chest" data-day="Chest+Triceps">Chest<br>+Triceps</div>
        <div class="day-opt back" data-day="Back+Biceps">Back<br>+Biceps</div>
        <div class="day-opt shoulders" data-day="Shoulders+Legs">Shoulders<br>+Legs</div>
      </div>
    </header>

    <div class="streak-row">
      <div class="stat-chip"><div class="num mono" id="streakNum">–</div><div class="label">Day Streak</div></div>
      <div class="stat-chip"><div class="num mono" id="exCount">–</div><div class="label">Exercises Today</div></div>
    </div>

    <main>
      <div id="view-today" class="view active"></div>

      <div id="view-progress" class="view">
        <div class="muscle-heading">Weekly Volume by Muscle</div>
        <div id="progressBody"></div>
      </div>

      <div id="view-library" class="view">
        <div class="muscle-heading">Full Exercise Library</div>
        <div id="libraryBody"></div>
      </div>
    </main>
  </div>

  <div id="restTimer">
    <div>
      <div class="rt-label" id="rtLabel">Rest</div>
      <div class="rt-time" id="rtTime">1:30</div>
    </div>
    <button id="rtSkip">Skip</button>
  </div>

  <nav>
    <button class="tab-btn active" data-view="today"><span class="icon">🏋️</span>Today</button>
    <button class="tab-btn" data-view="progress"><span class="icon">📈</span>Progress</button>
    <button class="tab-btn" data-view="library"><span class="icon">📋</span>Library</button>
  </nav>

  <!-- Business logic (ported from Code.gs) -->
  <script src="app.js"></script>
  <script>
    const DAY_CLASS = {
      'Chest+Triceps': 'day-chest',
      'Back+Biceps': 'day-back',
      'Shoulders+Legs': 'day-shoulders'
    };
    let todayData = null;

    // ---------- Tab switching ----------
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('view-' + btn.dataset.view).classList.add('active');
        if (btn.dataset.view === 'progress') loadProgress();
        if (btn.dataset.view === 'library') loadLibrary();
      });
    });

    // ---------- Today ----------
    // Was: google.script.run.withSuccessHandler(renderToday).getTodayData(null);
    App.getTodayData(null).then(renderToday).catch(showLoadError);

    document.getElementById('dayPicker').addEventListener('click', (e) => {
      const opt = e.target.closest('.day-opt');
      if (!opt) return;
      // Was: google.script.run.withSuccessHandler(renderToday).getTodayData(opt.dataset.day);
      App.getTodayData(opt.dataset.day).then(renderToday).catch(showLoadError);
    });

    function showLoadError(err) {
      console.error(err);
      document.getElementById('dayTitle').innerText = 'Connection error';
      document.getElementById('view-today').innerHTML =
        '<div class="empty">Couldn\'t reach the API. Check that API_URL in app.js is set to your deployed Apps Script Web App URL, and that it\'s deployed with access set to "Anyone".</div>';
    }

    function renderToday(data) {
      todayData = data;
      document.body.className = DAY_CLASS[data.dayType] || '';
      document.getElementById('dayTitle').innerText = data.dayType.replace('+', ' + ');
      document.getElementById('dayPillText').innerText = data.muscles.join(' · ');
      document.getElementById('exCount').innerText = data.exercises.length;

      document.querySelectorAll('.day-opt').forEach(opt => {
        opt.classList.toggle('active', opt.dataset.day === data.dayType);
        opt.classList.toggle('suggested', opt.dataset.day === data.suggested);
      });

      const container = document.getElementById('view-today');
      container.innerHTML = '';
      data.muscles.forEach(muscle => {
        const heading = document.createElement('div');
        heading.className = 'muscle-heading';
        heading.innerText = muscle;
        container.appendChild(heading);

        data.exercises.filter(e => e.muscle === muscle).forEach((ex, i) => {
          container.appendChild(buildCard(ex));
        });
      });

      document.getElementById('streakNum').innerText = data.streak;
    }

    function buildCard(ex) {
      const card = document.createElement('div');
      card.className = 'card';
      const lastText = ex.lastWeight ? `${ex.lastWeight}kg × ${ex.lastReps}` : 'No history yet';
      const baseWeight = ex.lastWeight || 10;
      const restSeconds = ex.type === 'compound' ? 60 : 60;

      card.innerHTML = `
        <div class="card-top">
          <div>
            <div class="ex-name">${ex.exercise}</div>
            <div class="ex-meta">Target ${ex.repLow}-${ex.repHigh} reps · Last: <span class="last">${lastText}</span></div>
            <div class="plate-track">${[1,2,3].map(()=>'<div class="plate"></div>').join('')}</div>
          </div>
          <div class="chevron">▾</div>
        </div>
        <div class="set-editor">
          ${[1,2,3].map(n => `
            <div class="set-row" data-set="${n}" data-touched="${n === 1 ? 'true' : 'false'}">
              <div class="set-label">Set ${n}</div>
              <div class="stepper wstep">
                <button class="dec" data-field="w">−</button>
                <span class="val w-val">${baseWeight}</span>
                <button class="inc" data-field="w">+</button>
              </div>
              <div class="stepper rstep">
                <button class="dec" data-field="r">−</button>
                <span class="val r-val">${ex.repLow}</span>
                <button class="inc" data-field="r">+</button>
              </div>
            </div>
          `).join('')}
          <div class="btn-row">
            <button class="log-btn">Log ${ex.exercise.split(' ')[0]}</button>
            <button class="skip-btn">Skip</button>
          </div>
          <div class="tip"></div>
        </div>
      `;

      card.querySelector('.card-top').addEventListener('click', () => {
        document.querySelectorAll('.card.open').forEach(c => { if (c !== card) c.classList.remove('open'); });
        card.classList.toggle('open');
      });

      // Adjusting Set 1 auto-fills Sets 2 & 3 (until the person edits one directly)
      // so logging identical straight sets takes one round of taps, not three.
      card.querySelectorAll('.stepper button').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const row = btn.closest('.set-row');
          const field = btn.dataset.field;
          const valSpan = btn.parentElement.querySelector('.val');
          let val = parseFloat(valSpan.innerText);
          const step = field === 'w' ? 2.5 : 1;
          const min = field === 'w' ? 0 : 1;
          if (btn.classList.contains('inc')) val += step; else val = Math.max(min, val - step);
          valSpan.innerText = field === 'w' ? val.toFixed(val % 1 === 0 ? 0 : 1) : val;

          if (row.dataset.set === '1') {
            card.querySelectorAll('.set-row').forEach(r => {
              if (r.dataset.set !== '1' && r.dataset.touched !== 'true') {
                r.querySelector(field === 'w' ? '.w-val' : '.r-val').innerText = valSpan.innerText;
              }
            });
          } else {
            row.dataset.touched = 'true';
          }
        });
      });

      card.querySelector('.log-btn').addEventListener('click', async (e) => {
        e.stopPropagation();
        const sets = [];
        card.querySelectorAll('.set-row').forEach(row => {
          sets.push({
            weight: parseFloat(row.querySelector('.w-val').innerText),
            reps: parseInt(row.querySelector('.r-val').innerText)
          });
        });
        const entry = {
          date: new Date().toISOString().slice(0,10),
          dayType: todayData.dayType,
          muscle: ex.muscle,
          exercise: ex.exercise,
          sets: sets,
          notes: ''
        };
        const tipEl = card.querySelector('.tip');
        tipEl.style.display = 'block';
        tipEl.innerText = 'Logging…';
        // Was: google.script.run.withSuccessHandler(tip => {...}).submitSets(entry);
        try {
          const tip = await App.submitSets(entry);
          tipEl.innerText = tip;
          card.classList.remove('skipped');
          const tag = card.querySelector('.skip-tag');
          if (tag) tag.remove();
          card.querySelectorAll('.plate').forEach(p => p.classList.add('filled'));
          startRestTimer(restSeconds, ex.exercise);
        } catch (err) {
          console.error(err);
          tipEl.innerText = 'Could not save — check your connection and try again.';
        }
      });

      card.querySelector('.skip-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        card.classList.remove('open');
        card.classList.add('skipped');
        if (!card.querySelector('.skip-tag')) {
          card.querySelector('.ex-name').insertAdjacentHTML('beforeend', ' <span class="skip-tag">Skipped</span>');
        }
      });

      return card;
    }

    // ---------- Rest Timer ----------
    let restInterval = null;
    function startRestTimer(seconds, label) {
      clearInterval(restInterval);
      let remaining = seconds;
      const el = document.getElementById('restTimer');
      const timeEl = document.getElementById('rtTime');
      const labelEl = document.getElementById('rtLabel');
      labelEl.innerText = 'Rest — ' + label;
      el.classList.add('show');
      render();
      restInterval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(restInterval);
          el.classList.remove('show');
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
          beep();
          return;
        }
        render();
      }, 1000);
      function render() {
        const m = Math.floor(remaining / 60), s = remaining % 60;
        timeEl.innerText = m + ':' + (s < 10 ? '0' : '') + s;
      }
    }
    document.getElementById('rtSkip').addEventListener('click', () => {
      clearInterval(restInterval);
      document.getElementById('restTimer').classList.remove('show');
    });
    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    }

    // ---------- Progress ----------
    async function loadProgress() {
      document.getElementById('progressBody').innerHTML = '<div class="empty">Loading…</div>';
      // Was: google.script.run.withSuccessHandler(data => {...}).getProgressData();
      let data;
      try {
        data = await App.getProgressData();
      } catch (err) {
        document.getElementById('progressBody').innerHTML = '<div class="empty">Couldn\'t load progress — check your connection.</div>';
        return;
      }
      const body = document.getElementById('progressBody');
      if (!data.volumeChart.some(v => v.volume > 0)) {
        body.innerHTML = '<div class="empty">No sets logged yet this week.<br>Log a workout on the Today tab to see it here.</div>';
        return;
      }
      body.innerHTML = data.volumeChart.map(v => `
        <div class="vol-row">
          <div class="vol-label-row"><span class="m">${v.muscle}</span><span class="v">${v.volume} kg</span></div>
          <div class="vol-bar-bg"><div class="vol-bar-fill" style="width:${v.pct}%"></div></div>
        </div>
      `).join('');
    }

    // ---------- Library ----------
    async function loadLibrary() {
      document.getElementById('libraryBody').innerHTML = '<div class="empty">Loading…</div>';
      // Was: google.script.run.withSuccessHandler(data => {...}).getLibraryData();
      let data;
      try {
        data = await App.getLibraryData();
      } catch (err) {
        document.getElementById('libraryBody').innerHTML = '<div class="empty">Couldn\'t load the library — check your connection.</div>';
        return;
      }
      const body = document.getElementById('libraryBody');
      body.innerHTML = Object.keys(data).map(muscle => `
        <div class="lib-group">
          <div class="muscle-heading">${muscle}</div>
          ${data[muscle].map(e => `
            <div class="lib-item ${e.enabled ? '' : 'disabled'}" data-exercise="${e.exercise}">
              <div class="info">
                <span class="ex-title">${e.exercise}</span>
                <span class="r">${e.repLow}-${e.repHigh} reps · ${e.dayType}</span>
              </div>
              <div class="switch ${e.enabled ? 'on' : ''}"><div class="knob"></div></div>
            </div>
          `).join('')}
        </div>
      `).join('') + '<div class="picker-label" style="margin-top:6px;">Toggle off any exercise you want dropped — it disappears from Today until switched back on.</div>';

      body.querySelectorAll('.lib-item').forEach(item => {
        item.querySelector('.switch').addEventListener('click', async () => {
          const sw = item.querySelector('.switch');
          const willEnable = !sw.classList.contains('on');
          sw.classList.toggle('on', willEnable);
          item.classList.toggle('disabled', !willEnable);
          // Was: google.script.run.setExerciseEnabled(item.dataset.exercise, willEnable);
          try {
            await App.setExerciseEnabled(item.dataset.exercise, willEnable);
          } catch (err) {
            console.error(err);
          }
        });
      });
    }
  </script>
</body>
</html>
